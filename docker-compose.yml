services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: spm-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - spm-mssql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  spm-mssql-data:
